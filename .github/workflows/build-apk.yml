name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              git \
              python3-pip \
              python3-setuptools \
              python3-wheel \
              libffi-dev \
              libssl-dev \
              zlib1g-dev \
              libncurses5 \
              libncursesw5 \
              libtinfo5 \
              autoconf \
              libtool \
              pkg-config \
              unzip \
              zip \
              ant \
              openjdk-17-jdk

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Build with Buildozer
        run: |
          buildozer init || true
          sed -i 's/# title =.*/title = Hisabi/' buildozer.spec
          sed -i 's/# package.name =.*/package.name = hisabi/' buildozer.spec
          sed -i 's/# package.domain =.*/package.domain = org.suhail/' buildozer.spec
          sed -i 's/# requirements =.*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/# orientation =.*/orientation = portrait/' buildozer.spec
          sed -i 's/# android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/# android.min_api =.*/android.min_api = 21/' buildozer.spec
          
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
